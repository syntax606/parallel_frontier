  # → digest:rivals (titles only in digest, so you never duplicate them unknowingly)
  # Substack {name}.substack.com/feed is reliable; the rest marked VERIFY.
  rivals:
    # NOTE: *.substack.com feeds 403 from GitHub Actions datacenter IPs (IP-level
    # block — a browser User-Agent does NOT defeat it; confirmed in CI). These are
    # newsletters you can subscribe to by email directly. Re-enable if you ever run
