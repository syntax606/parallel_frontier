# ─────────────────────────────────────────────────────────────────────────────
# Russia edition (region=russia) — official/state feeds, title-gated to AI/tech.
# Renders in a 🇷🇺 Russia block in the same email. Gate mixes Russian stems +
# English (no bare "ИИ" — collides with "России"). Conservative: 3 official/state
# sources; validate before adding corporate (Sber/Yandex) or think tanks.
# ─────────────────────────────────────────────────────────────────────────────
russia:
  keywords:
    # Russian stems
    - искусственн          # искусственный интеллект (AI)
    - нейросет             # нейросеть (neural net)
    - машинное обучение
    - большая языковая модель
    - полупроводник        # semiconductor
    - микроэлектроник
    - суперкомпьютер
    - квантов              # quantum
    - беспилотн            # autonomous/UAV
    - гигачат              # GigaChat (Sber)
    - yandexgpt
    # tech-sovereignty / chip policy — the real Russia "frontier" signal
    - импортозамещени      # import substitution (chips)
    - технологическ сувере # technological sovereignty
    - цифровой суверенит    # digital sovereignty
    # English (for TASS en + English mentions)
    - artificial intelligence
    - machine learning
    - neural network
    - semiconductor
    - microelectronic
    - supercomputer
    - quantum comput
    - large language model
  sources:
    - name: Кремль (Kremlin)
      url: http://kremlin.ru/events/president/news/feed   # Russian-language feed
      category: regulation
    - name: TASS
      url: https://tass.com/rss/v2.xml                     # English state news
      category: discourse
    - name: Government.ru
      url: http://government.ru/all/rss/                    # Russian-language feed
      category: regulation

# ─────────────────────────────────────────────────────────────────────────────
# Delivery
# ─────────────────────────────────────────────────────────────────────────────
digest:
  # Resend's test sender only delivers to your Resend account email
  # (syntax606@gmail.com). Once you verify a domain, switch the sender below and
  # you can send anywhere (e.g. css216@nyu.edu).
  recipients: [syntax606@gmail.com]
  # Resend's test sender — no domain verification needed, but ONLY delivers to the
  # email your Resend account is registered under. Swap to a verified domain
  # (e.g. digest@yourdomain.com) for production / arbitrary recipients.
  sender: "Parallel Frontier <onboarding@resend.dev>"
  send_hour_utc: 6          # ~07:30 UK in summer; fixed UTC, accept DST drift (see SPEC)
  provider: resend          # resend | postmark  (API key in GitHub secrets: RESEND_API_KEY)
  capture_url: ""           # optional footer link to your manual capture file
# alert:
#   telegram_chat_id: ""    # optional: mirror alert-tier only, for true interrupts
